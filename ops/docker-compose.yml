name: 2026-interview-stub

services:
  app:
    image: node:26.13.0-alpine
    working_dir: /app
    command: sh -c "npm ci && node --watch src/index.ts"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/app
    volumes:
      - ..:/app
      - /app/node_modules
    depends_on:
      - mongo

  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
